<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приключение Шахины 💖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #0f0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 8px 10px;
            background: rgba(15, 14, 23, 0.95);
            z-index: 5;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            color: #ff8fab;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #3a86ff;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Управление снизу */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 15px 25px 15px;
            background: rgba(15, 14, 23, 0.98);
            gap: 12px;
            z-index: 10;
            flex-shrink: 0;
        }

        .dir-group {
            display: flex;
            gap: 10px;
            flex: 1.2;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ff70a6;
            color: #fff;
            font-size: 1.5rem;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex: 1;
            height: 65px;
            touch-action: none;
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 112, 166, 0.6);
            transform: scale(0.95);
        }

        .jump-btn {
            background: rgba(255, 112, 166, 0.35);
            border-color: #ff477e;
            flex: 1;
            height: 65px;
            font-size: 1.05rem;
        }

        /* Экраны победы/поражения */
        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 14, 23, 0.96);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 25;
        }

        .screen h2 {
            font-size: 1.7rem;
            margin: 0 0 10px 0;
            color: #ff70a6;
        }

        #lose-screen h2 { color: #ff4757; }

        .screen p {
            font-size: 1.05rem;
            max-width: 400px;
            line-height: 1.4;
            color: #f1f1f1;
            margin: 0 0 20px 0;
        }

        .restart-btn {
            background: #ff70a6;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 112, 166, 0.5);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Пройди долгий путь к моему сердечку! 👑💖</h1>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="win-screen" class="screen">
            <h2>Ура, ты победила! 🎉</h2>
            <p>Ты у меня самая лучшая Шахина, принцесса моя всегда будь такой маленькой пикми ❤️</p>
            <button class="restart-btn" id="winRestart">Сыграть еще раз</button>
        </div>

        <div id="lose-screen" class="screen">
            <h2>Ой-ой, упс! 🙈</h2>
            <p>Ничего страшного, настоящие принцессы проходят через любые преграды! Давай попробуем еще разок?</p>
            <button class="restart-btn" id="loseRestart">Попробовать снова</button>
        </div>
    </div>

    <div class="controls">
        <div class="dir-group">
            <button class="btn" id="leftBtn">⬅️</button>
            <button class="btn" id="rightBtn">➡️</button>
        </div>
        <button class="btn jump-btn" id="jumpBtn">Прыжок ⬆️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Виртуальное разрешение для широкого охвата камеры (вместо мелкого зума)
        const VIEW_WIDTH = 900;
        let VIEW_HEIGHT = 500;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            VIEW_HEIGHT = VIEW_WIDTH * (canvas.height / canvas.width);
            setupPositions();
        }
        window.addEventListener('resize', resizeCanvas);

        let gameWon = false;
        let gameOver = false;

        const player = {
            x: 80,
            y: 0,
            width: 36,
            height: 52,
            speed: 5.5,
            dx: 0,
            dy: 0,
            jumpPower: -12.5,
            gravity: 0.55,
            grounded: false
        };

        const platforms = [
            { x: 0, y: 0, width: 3800, height: 60, type: 'ground' },
            { x: 350, y: 0, width: 150, height: 22, type: 'brick' },
            { x: 580, y: 0, width: 140, height: 22, type: 'brick' },
            { x: 820, y: 0, width: 160, height: 22, type: 'brick' },
            { x: 1080, y: 0, width: 150, height: 22, type: 'brick' },
            { x: 1340, y: 0, width: 140, height: 22, type: 'brick' },
            { x: 1600, y: 0, width: 160, height: 22, type: 'brick' },
            { x: 1880, y: 0, width: 150, height: 22, type: 'brick' },
            { x: 2140, y: 0, width: 140, height: 22, type: 'brick' },
            { x: 2400, y: 0, width: 160, height: 22, type: 'brick' },
            { x: 2680, y: 0, width: 170, height: 22, type: 'brick' },
            { x: 2960, y: 0, width: 180, height: 22, type: 'brick' }
        ];

        let enemies = [
            { x: 380, y: 0, width: 30, height: 28, speed: 1.6, minX: 350, maxX: 460, dir: 1 },
            { x: 860, y: 0, width: 30, height: 28, speed: 1.9, minX: 820, maxX: 950, dir: 1 },
            { x: 1120, y: 0, width: 30, height: 28, speed: 1.3, minX: 1080, maxX: 1200, dir: 1 },
            { x: 1400, y: 0, width: 30, height: 28, speed: 2.1, minX: 1340, maxX: 1450, dir: 1 },
            { x: 1940, y: 0, width: 30, height: 28, speed: 1.7, minX: 1880, maxX: 2000, dir: 1 },
            { x: 2460, y: 0, width: 30, height: 28, speed: 1.5, minX: 2400, maxX: 2530, dir: 1 },
            { x: 3020, y: 0, width: 30, height: 28, speed: 1.4, minX: 2960, maxX: 3110, dir: 1 }
        ];

        const flag = {
            x: 3400,
            y: 0,
            width: 50,
            height: 100
        };

        function setupPositions() {
            const groundY = VIEW_HEIGHT - 60;
            platforms[0].y = groundY;
            platforms[0].height = 60;

            // Низкие комфортные платформы
            platforms[1].y = VIEW_HEIGHT - 160;
            platforms[2].y = VIEW_HEIGHT - 210;
            platforms[3].y = VIEW_HEIGHT - 160;
            platforms[4].y = VIEW_HEIGHT - 210;
            platforms[5].y = VIEW_HEIGHT - 160;
            platforms[6].y = VIEW_HEIGHT - 220;
            platforms[7].y = VIEW_HEIGHT - 160;
            platforms[8].y = VIEW_HEIGHT - 210;
            platforms[9].y = VIEW_HEIGHT - 160;
            platforms[10].y = VIEW_HEIGHT - 210;
            platforms[11].y = VIEW_HEIGHT - 160;

            enemies[0].y = groundY - 28;
            enemies[1].y = groundY - 28;
            enemies[2].y = platforms[4].y - 28;
            enemies[3].y = groundY - 28;
            enemies[4].y = groundY - 28;
            enemies[5].y = groundY - 28;
            enemies[6].y = groundY - 28;

            flag.y = groundY - 100;

            if (player.y === 0) {
                player.y = groundY - player.height;
            }
        }

        resizeCanvas();

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); };
            const deactivate = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); };

            el.addEventListener('touchstart', activate, {passive: false});
            el.addEventListener('touchend', deactivate, {passive: false});
            el.addEventListener('touchcancel', deactivate, {passive: false});
            el.addEventListener('mousedown', activate);
            el.addEventListener('mouseup', deactivate);
            el.addEventListener('mouseleave', deactivate);
        }
        bindTouch('leftBtn', 'ArrowLeft');
        bindTouch('rightBtn', 'ArrowRight');
        bindTouch('jumpBtn', 'Space');

        document.getElementById('winRestart').addEventListener('click', restartGame);
        document.getElementById('loseRestart').addEventListener('click', restartGame);

        let cameraX = 0;

        function update() {
            if (gameWon || gameOver) return;

            player.dx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;

            if ((keys['Space'] || keys['ArrowUp'] || keys['W']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += player.gravity;

            // Коллизия по X
            player.x += player.dx;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dx > 0) player.x = p.x - player.width;
                    else if (player.dx < 0) player.x = p.x + p.width;
                }
            });

            // Коллизия по Y
            player.y += player.dy;
            player.grounded = false;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dy > 0) {
                        player.y = p.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                    } else if (player.dy < 0) {
                        player.y = p.y + p.height;
                        player.dy = 0;
                    }
                }
            });

            // Враги
            enemies.forEach(en => {
                en.x += en.speed * en.dir;
                if (en.x > en.maxX || en.x < en.minX) en.dir *= -1;

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= en.y + 12) {
                        enemies.splice(enemies.indexOf(en), 1);
                        player.dy = -10;
                    } else {
                        gameOver = true;
                        document.getElementById('lose-screen').style.display = 'flex';
                    }
                }
            });

            if (player.y > VIEW_HEIGHT + 100) {
                gameOver = true;
                document.getElementById('lose-screen').style.display = 'flex';
            }

            if (
                player.x < flag.x + flag.width &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.height &&
                player.y + player.height > flag.y
            ) {
                gameWon = true;
                document.getElementById('win-screen').style.display = 'flex';
            }

            cameraX = player.x - VIEW_WIDTH * 0.3;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > 3800 - VIEW_WIDTH) cameraX = 3800 - VIEW_WIDTH;
        }

        function draw() {
            // Масштабируем под размер экрана
            ctx.setTransform(canvas.width / VIEW_WIDTH, 0, 0, canvas.height / VIEW_HEIGHT, 0, 0);

            let skyGradient = ctx.createLinearGradient(0, 0, 0, VIEW_HEIGHT);
            skyGradient.addColorStop(0, '#2b2d42');
            skyGradient.addColorStop(0.5, '#3a86ff');
            skyGradient.addColorStop(1, '#8338ec');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Облака
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            for (let i = 150; i < 3800; i += 300) {
                ctx.beginPath();
                ctx.arc(i, 80, 45, 0, Math.PI * 2);
                ctx.arc(i + 45, 60, 60, 0, Math.PI * 2);
                ctx.arc(i + 100, 80, 45, 0, Math.PI * 2);
                ctx.fill();
            }

            // Платформы
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#1b4332';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#2d6a4f';
                    ctx.fillRect(p.x, p.y, p.width, 14);
                    ctx.fillStyle = '#52b788';
                    ctx.fillRect(p.x, p.y, p.width, 4);
                } else {
                    ctx.fillStyle = '#cc5803';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#e85d04';
                    ctx.fillRect(p.x, p.y, p.width, 7);
                    ctx.fillStyle = '#ffba08';
                    ctx.fillRect(p.x, p.y, p.width, 3);
                }
            });

            // Враги
            enemies.forEach(en => {
                ctx.fillStyle = '#d90429';
                ctx.beginPath();
                ctx.arc(en.x + en.width/2, en.y + 12, 15, Math.PI, 0, false);
                ctx.fill();
                ctx.fillStyle = '#ffccd5';
                ctx.fillRect(en.x + 4, en.y + 12, 22, 16);
                ctx.fillStyle = '#000';
                ctx.fillRect(en.x + 8, en.y + 16, 3, 4);
                ctx.fillRect(en.x + 19, en.y + 16, 3, 4);
            });

            // Замок финиша
            ctx.fillStyle = '#ff70a6';
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            ctx.fillStyle = '#ff97b7';
            ctx.fillRect(flag.x - 7, flag.y - 40, flag.width + 14, 40);
            ctx.font = '40px sans-serif';
            ctx.fillText('💖', flag.x + 2, flag.y - 48);

            // Персонаж (Шахина)
            const px = player.x;
            const py = player.y;

            // Платье
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(px + 5, py + 20, player.width - 10, player.height - 20);
            ctx.fillStyle = '#ff668a';
            ctx.fillRect(px + 2, py + 42, player.width - 4, 10);

            // Волосы
            ctx.fillStyle = '#ffb703';
            ctx.fillRect(px + 5, py + 4, player.width - 10, 18);

            // Лицо
            ctx.fillStyle = '#ffe5ec';
            ctx.fillRect(px + 8, py + 8, player.width - 16, 12);
            ctx.fillStyle = '#2b2d42';
            ctx.fillRect(px + 11, py + 12, 3, 3);
            ctx.fillRect(px + 22, py + 12, 3, 3);

            // Корона
            ctx.fillStyle = '#ffbc42';
            ctx.beginPath();
            ctx.moveTo(px + 6, py + 4);
            ctx.lineTo(px + 11, py - 4);
            ctx.lineTo(px + 18, py + 2);
            ctx.lineTo(px + 25, py - 4);
            ctx.lineTo(px + 30, py + 4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
            ctx.setTransform(1, 0, 0, 1, 0, 0); // сброс матрицы
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            gameWon = false;
            gameOver = false;
            player.x = 80;
            player.y = platforms[0].y - player.height;
            player.dx = 0;
            player.dy = 0;
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            keys['Space'] = false;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('pressed'));
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lose-screen').style.display = 'none';
        }

        loop();
    </script>
</body>
</html>
