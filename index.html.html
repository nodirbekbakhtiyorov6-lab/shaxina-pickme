<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приключение Шахины 💖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0f0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #ff8fab;
            text-align: center;
            padding: 0 10px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            background: #3a86ff;
            border: 3px solid #ff70a6;
            width: 100%;
            max-width: 800px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(to bottom, #3a86ff, #8338ec);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 15px 20px;
            gap: 15px;
        }

        .dir-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ff70a6;
            color: #fff;
            padding: 18px 28px;
            font-size: 1.4rem;
            border-radius: 16px;
            cursor: pointer;
            touch-action: manipulation;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 112, 166, 0.5);
            transform: scale(0.95);
        }

        .jump-btn {
            background: rgba(255, 112, 166, 0.3);
            border-color: #ff477e;
        }

        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 14, 23, 0.94);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .screen h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ff70a6;
        }

        #lose-screen h2 { color: #ff4757; }

        .screen p {
            font-size: 1.2rem;
            max-width: 480px;
            line-height: 1.6;
            color: #f1f1f1;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: #ff70a6;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 112, 166, 0.4);
        }
    </style>
</head>
<body>

    <h1>Пройди долгий путь к моему сердечку! 👑💖</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="win-screen" class="screen">
            <h2>Ура, ты победила! 🎉</h2>
            <p>Ты у меня самая лучшая Шахина, принцесса моя всегда будь такой маленькой пикми ❤️</p>
            <button class="restart-btn" onclick="restartGame()">Сыграть еще раз</button>
        </div>

        <div id="lose-screen" class="screen">
            <h2>Ой-ой, упс! 🙈</h2>
            <p>Ничего страшного, настоящие принцессы проходят через любые преграды! Давай попробуем еще разок?</p>
            <button class="restart-btn" onclick="restartGame()">Попробовать снова</button>
        </div>
    </div>

    <div class="controls">
        <div class="dir-buttons">
            <button class="btn" id="leftBtn">⬅️</button>
            <button class="btn" id="rightBtn">➡️</button>
        </div>
        <button class="btn jump-btn" id="jumpBtn">Прыжок ⬆️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameWon = false;
        let gameOver = false;

        const player = {
            x: 50,
            y: 250,
            width: 32,
            height: 48,
            speed: 4.5,
            dx: 0,
            dy: 0,
            jumpPower: -11.5,
            gravity: 0.5,
            grounded: false
        };

        const platforms = [
            { x: 0, y: 350, width: 3400, height: 50, type: 'ground' },
            { x: 300, y: 260, width: 140, height: 20, type: 'brick' },
            { x: 520, y: 190, width: 130, height: 20, type: 'brick' },
            { x: 740, y: 260, width: 140, height: 20, type: 'brick' },
            { x: 980, y: 200, width: 150, height: 20, type: 'brick' },
            { x: 1220, y: 260, width: 130, height: 20, type: 'brick' },
            { x: 1450, y: 180, width: 140, height: 20, type: 'brick' },
            { x: 1700, y: 250, width: 150, height: 20, type: 'brick' },
            { x: 1950, y: 190, width: 130, height: 20, type: 'brick' },
            { x: 2200, y: 260, width: 140, height: 20, type: 'brick' },
            { x: 2450, y: 180, width: 150, height: 20, type: 'brick' },
            { x: 2750, y: 250, width: 180, height: 20, type: 'brick' }
        ];

        let enemies = [
            { x: 350, y: 325, width: 28, height: 25, speed: 1.5, minX: 300, maxX: 430, dir: 1 },
            { x: 780, y: 325, width: 28, height: 25, speed: 1.8, minX: 740, maxX: 870, dir: 1 },
            { x: 1020, y: 175, width: 28, height: 25, speed: 1.2, minX: 980, maxX: 1120, dir: 1 },
            { x: 1300, y: 325, width: 28, height: 25, speed: 2, minX: 1220, maxX: 1340, dir: 1 },
            { x: 1750, y: 225, width: 28, height: 25, speed: 1.5, minX: 1700, maxX: 1840, dir: 1 },
            { x: 2250, y: 325, width: 28, height: 25, speed: 1.8, minX: 2200, maxX: 2330, dir: 1 },
            { x: 2800, y: 225, width: 28, height: 25, speed: 1.4, minX: 2750, maxX: 2920, dir: 1 }
        ];

        const flag = {
            x: 3150,
            y: 250,
            width: 45,
            height: 100
        };

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); });
            el.addEventListener('mousedown', () => { keys[code] = true; el.classList.add('pressed'); });
            el.addEventListener('mouseup', () => { keys[code] = false; el.classList.remove('pressed'); });
            el.addEventListener('mouseleave', () => { keys[code] = false; el.classList.remove('pressed'); });
        }
        bindTouch('leftBtn', 'ArrowLeft');
        bindTouch('rightBtn', 'ArrowRight');
        bindTouch('jumpBtn', 'Space');

        let cameraX = 0;

        function update() {
            if (gameWon || gameOver) return;

            player.dx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;

            if ((keys['Space'] || keys['ArrowUp'] || keys['W']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += player.gravity;
            player.x += player.dx;
            player.y += player.dy;

            player.grounded = false;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.dy <= p.y
                ) {
                    player.y = p.y - player.height;
                    player.dy = 0;
                    player.grounded = true;
                }
            });

            enemies.forEach(en => {
                en.x += en.speed * en.dir;
                if (en.x > en.maxX || en.x < en.minX) {
                    en.dir *= -1;
                }

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= en.y + 12) {
                        enemies.splice(enemies.indexOf(en), 1);
                        player.dy = -8;
                    } else {
                        gameOver = true;
                        document.getElementById('lose-screen').style.display = 'flex';
                    }
                }
            });

            if (player.y > canvas.height) {
                gameOver = true;
                document.getElementById('lose-screen').style.display = 'flex';
            }

            if (
                player.x < flag.x + flag.width &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.height &&
                player.y + player.height > flag.y
            ) {
                gameWon = true;
                document.getElementById('win-screen').style.display = 'flex';
            }

            cameraX = player.x - 250;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > 3400 - canvas.width) cameraX = 3400 - canvas.width;
        }

        function draw() {
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#3a86ff');
            skyGradient.addColorStop(1, '#8338ec');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Облака
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 120; i < 3400; i += 320) {
                ctx.beginPath();
                ctx.arc(i, 90, 35, 0, Math.PI * 2);
                ctx.arc(i + 35, 75, 45, 0, Math.PI * 2);
                ctx.arc(i + 75, 90, 35, 0, Math.PI * 2);
                ctx.fill();
            }

            // Платформы
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#2b9348';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#55a630';
                    ctx.fillRect(p.x, p.y, p.width, 8);
                } else {
                    ctx.fillStyle = '#f77f00';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#fcbf49';
                    ctx.fillRect(p.x, p.y, p.width, 5);
                }
            });

            // Враги
            enemies.forEach(en => {
                ctx.fillStyle = '#d90429';
                ctx.beginPath();
                ctx.arc(en.x + en.width/2, en.y + 10, 14, Math.PI, 0, false);
                ctx.fill();
                ctx.fillStyle = '#ffccd5';
                ctx.fillRect(en.x + 6, en.y + 12, 16, 13);
                ctx.fillStyle = '#000';
                ctx.fillRect(en.x + 9, en.y + 15, 3, 3);
                ctx.fillRect(en.x + 16, en.y + 15, 3, 3);
            });

            // Замок на финише
            ctx.fillStyle = '#ff70a6';
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            ctx.fillStyle = '#ff97b7';
            ctx.fillRect(flag.x - 5, flag.y - 35, flag.width + 10, 35);
            ctx.font = '36px sans-serif';
            ctx.fillText('💖', flag.x + 3, flag.y - 45);

            // Нормальная фигурка принцессы (аккуратный персонаж в платье и короне)
            const px = player.x;
            const py = player.y;

            // Тело / Пышное розовое платье (прямоугольное/округленное снизу, без треугольников)
            ctx.fillStyle = '#ff4d6d';
            ctx.fillRect(px + 4, py + 18, player.width - 8, player.height - 18);
            ctx.fillStyle = '#ff758f';
            ctx.fillRect(px + 2, py + 38, player.width - 4, 10); // Низ платья

            // Голова и волосы
            ctx.fillStyle = '#ffb703';
            ctx.fillRect(px + 5, py + 4, player.width - 10, 16);

            // Лицо
            ctx.fillStyle = '#ffe5ec';
            ctx.fillRect(px + 8, py + 8, player.width - 16, 10);
            ctx.fillStyle = '#2b2d42';
            ctx.fillRect(px + 10, py + 11, 3, 3);
            ctx.fillRect(px + 19, py + 11, 3, 3);

            // Корона
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.moveTo(px + 7, py + 4);
            ctx.lineTo(px + 11, py - 3);
            ctx.lineTo(px + 16, py + 2);
            ctx.lineTo(px + 21, py - 3);
            ctx.lineTo(px + 25, py + 4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            gameWon = false;
            gameOver = false;
            player.x = 50;
            player.y = 250;
            player.dy = 0;
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lose-screen').style.display = 'none';
        }

        loop();
    </script>
</body>
</html>
