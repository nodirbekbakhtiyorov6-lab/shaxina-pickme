<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приключение Шахины 💖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0f0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 6px 10px;
            background: rgba(15, 14, 23, 0.9);
            z-index: 5;
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #ff8fab;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #3a86ff;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Управление на весь экран снизу */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 12px 20px 24px 20px;
            background: rgba(15, 14, 23, 0.95);
            gap: 15px;
            z-index: 10;
        }

        .dir-group {
            display: flex;
            gap: 12px;
            flex: 1;
        }

        .btn {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #ff70a6;
            color: #fff;
            font-size: 1.6rem;
            border-radius: 18px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex: 1;
            height: 70px;
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 112, 166, 0.5);
            transform: scale(0.96);
        }

        .jump-btn {
            background: rgba(255, 112, 166, 0.3);
            border-color: #ff477e;
            flex: 1.2;
            height: 70px;
            font-size: 1.1rem;
        }

        /* Экраны победы/поражения */
        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 14, 23, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 25;
        }

        .screen h2 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            color: #ff70a6;
        }

        #lose-screen h2 { color: #ff4757; }

        .screen p {
            font-size: 1.1rem;
            max-width: 450px;
            line-height: 1.5;
            color: #f1f1f1;
            margin: 0 0 20px 0;
        }

        .restart-btn {
            background: #ff70a6;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 112, 166, 0.5);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Пройди долгий путь к моему сердечку! 👑💖</h1>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="win-screen" class="screen">
            <h2>Ура, ты победила! 🎉</h2>
            <p>Ты у меня самая лучшая Шахина, принцесса моя всегда будь такой маленькой пикми ❤️</p>
            <button class="restart-btn" id="winRestart">Сыграть еще раз</button>
        </div>

        <div id="lose-screen" class="screen">
            <h2>Ой-ой, упс! 🙈</h2>
            <p>Ничего страшного, настоящие принцессы проходят через любые преграды! Давай попробуем еще разок?</p>
            <button class="restart-btn" id="loseRestart">Попробовать снова</button>
        </div>
    </div>

    <div class="controls">
        <div class="dir-group">
            <button class="btn" id="leftBtn">⬅️</button>
            <button class="btn" id="rightBtn">➡️</button>
        </div>
        <button class="btn jump-btn" id="jumpBtn">Прыжок ⬆️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.6; // Подгоняем под пропорции экрана игры
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameWon = false;
        letgameOver = false;

        const player = {
            x: 80,
            y: 200,
            width: 36,
            height: 52,
            speed: 5,
            dx: 0,
            dy: 0,
            jumpPower: -12.5,
            gravity: 0.55,
            grounded: false
        };

        const platforms = [
            { x: 0, y: 360, width: 3800, height: 80, type: 'ground' },
            { x: 350, y: 260, width: 150, height: 22, type: 'brick' },
            { x: 600, y: 180, width: 140, height: 22, type: 'brick' },
            { x: 850, y: 260, width: 160, height: 22, type: 'brick' },
            { x: 1120, y: 190, width: 150, height: 22, type: 'brick' },
            { x: 1380, y: 260, width: 140, height: 22, type: 'brick' },
            { x: 1640, y: 170, width: 160, height: 22, type: 'brick' },
            { x: 1920, y: 250, width: 150, height: 22, type: 'brick' },
            { x: 2180, y: 180, width: 140, height: 22, type: 'brick' },
            { x: 2450, y: 260, width: 160, height: 22, type: 'brick' },
            { x: 2750, y: 175, width: 170, height: 22, type: 'brick' },
            { x: 3050, y: 250, width: 180, height: 22, type: 'brick' }
        ];

        let enemies = [
            { x: 400, y: 332, width: 30, height: 28, speed: 1.6, minX: 350, maxX: 480, dir: 1 },
            { x: 900, y: 332, width: 30, height: 28, speed: 1.9, minX: 850, maxX: 990, dir: 1 },
            { x: 1160, y: 162, width: 30, height: 28, speed: 1.3, minX: 1120, maxX: 1240, dir: 1 },
            { x: 1440, y: 332, width: 30, height: 28, speed: 2.1, minX: 1380, maxX: 1500, dir: 1 },
            { x: 1980, y: 332, width: 30, height: 28, speed: 1.7, minX: 1920, maxX: 2050, dir: 1 },
            { x: 2500, y: 332, width: 30, height: 28, speed: 1.5, minX: 2450, maxX: 2590, dir: 1 },
            { x: 3100, y: 222, width: 30, height: 28, speed: 1.4, minX: 3050, maxX: 3210, dir: 1 }
        ];

        const flag = {
            x: 3500,
            y: 260,
            width: 50,
            height: 100
        };

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); };
            const deactivate = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); };

            el.addEventListener('touchstart', activate, {passive: false});
            el.addEventListener('touchend', deactivate, {passive: false});
            el.addEventListener('touchcancel', deactivate, {passive: false});
            el.addEventListener('mousedown', activate);
            el.addEventListener('mouseup', deactivate);
            el.addEventListener('mouseleave', deactivate);
        }
        bindTouch('leftBtn', 'ArrowLeft');
        bindTouch('rightBtn', 'ArrowRight');
        bindTouch('jumpBtn', 'Space');

        document.getElementById('winRestart').addEventListener('click', restartGame);
        document.getElementById('loseRestart').addEventListener('click', restartGame);

        let cameraX = 0;

        function update() {
            if (gameWon || gameOver) return;

            player.dx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;

            if ((keys['Space'] || keys['ArrowUp'] || keys['W']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += player.gravity;

            // Коллизия по X
            player.x += player.dx;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dx > 0) player.x = p.x - player.width;
                    else if (player.dx < 0) player.x = p.x + p.width;
                }
            });

            // Коллизия по Y
            player.y += player.dy;
            player.grounded = false;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dy > 0) {
                        player.y = p.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                    } else if (player.dy < 0) {
                        player.y = p.y + p.height;
                        player.dy = 0;
                    }
                }
            });

            // Враги
            enemies.forEach(en => {
                en.x += en.speed * en.dir;
                if (en.x > en.maxX || en.x < en.minX) en.dir *= -1;

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= en.y + 12) {
                        enemies.splice(enemies.indexOf(en), 1);
                        player.dy = -9;
                    } else {
                        gameOver = true;
                        document.getElementById('lose-screen').style.display = 'flex';
                    }
                }
            });

            if (player.y > canvas.height + 100) {
                gameOver = true;
                document.getElementById('lose-screen').style.display = 'flex';
            }

            if (
                player.x < flag.x + flag.width &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.height &&
                player.y + player.height > flag.y
            ) {
                gameWon = true;
                document.getElementById('win-screen').style.display = 'flex';
            }

            cameraX = player.x - canvas.width * 0.35;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > 3800 - canvas.width) cameraX = 3800 - canvas.width;
        }

        function draw() {
            // Красивый градиент неба
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#2b2d42');
            skyGradient.addColorStop(0.5, '#3a86ff');
            skyGradient.addColorStop(1, '#8338ec');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Детализированные облака
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            for (let i = 150; i < 3800; i += 300) {
                ctx.beginPath();
                ctx.arc(i, 80, 40, 0, Math.PI * 2);
                ctx.arc(i + 40, 65, 55, 0, Math.PI * 2);
                ctx.arc(i + 90, 80, 40, 0, Math.PI * 2);
                ctx.fill();
            }

            // Платформы с улучшенной графикой
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#1b4332';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#2d6a4f';
                    ctx.fillRect(p.x, p.y, p.width, 12);
                    ctx.fillStyle = '#52b788';
                    ctx.fillRect(p.x, p.y, p.width, 4);
                } else {
                    ctx.fillStyle = '#cc5803';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#e85d04';
                    ctx.fillRect(p.x, p.y, p.width, 7);
                    ctx.fillStyle = '#ffba08';
                    ctx.fillRect(p.x, p.y, p.width, 3);
                }
            });

            // Враги
            enemies.forEach(en => {
                ctx.fillStyle = '#d90429';
                ctx.beginPath();
                ctx.arc(en.x + en.width/2, en.y + 12, 15, Math.PI, 0, false);
                ctx.fill();
                ctx.fillStyle = '#ffccd5';
                ctx.fillRect(en.x + 5, en.y + 14, 20, 14);
                ctx.fillStyle = '#000';
                ctx.fillRect(en.x + 8, en.y + 17, 3, 4);
                ctx.fillRect(en.x + 19, en.y + 17, 3, 4);
            });

            // Замок финиша
            ctx.fillStyle = '#ff70a6';
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            ctx.fillStyle = '#ff97b7';
            ctx.fillRect(flag.x - 6, flag.y - 40, flag.width + 12, 40);
            ctx.font = '40px sans-serif';
            ctx.fillText('💖', flag.x + 2, flag.y - 50);

            // Графика принцессы
            const px = player.x;
            const py = player.y;

            // Платье
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(px + 4, py + 20, player.width - 8, player.height - 20);
            ctx.fillStyle = '#ff668a';
            ctx.fillRect(px + 1, py + 42, player.width - 2, 10);

            // Волосы
            ctx.fillStyle = '#ffb703';
            ctx.fillRect(px + 5, py + 4, player.width - 10, 18);

            // Лицо
            ctx.fillStyle = '#ffe5ec';
            ctx.fillRect(px + 8, py + 9, player.width - 16, 11);
            ctx.fillStyle = '#2b2d42';
            ctx.fillRect(px + 10, py + 12, 3, 3);
            ctx.fillRect(px + 21, py + 12, 3, 3);

            // Корона
            ctx.fillStyle = '#ffbc42';
            ctx.beginPath();
            ctx.moveTo(px + 6, py + 4);
            ctx.lineTo(px + 11, py - 4);
            ctx.lineTo(px + 18, py + 2);
            ctx.lineTo(px + 24, py - 4);
            ctx.lineTo(px + 29, py + 4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            gameWon = false;
            gameOver = false;
            player.x = 80;
            player.y = 200;
            player.dx = 0;
            player.dy = 0;
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            keys['Space'] = false;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('pressed'));
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lose-screen').style.display = 'none';
        }

        loop();
    </script>
</body>
</html>
