<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приключение Шахины 💖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #0f0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(15, 14, 23, 0.95);
            z-index: 5;
            flex-shrink: 0;
            border-bottom: 2px solid rgba(255, 112, 166, 0.2);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn-small {
            background: linear-gradient(135deg, #ff70a6, #ff477e);
            border: none;
            color: #fff;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(255, 112, 166, 0.4);
        }

        h1 {
            margin: 0;
            font-size: 0.85rem;
            color: #ff8fab;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hud-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .level-indicator {
            font-size: 0.8rem;
            color: #ffb703;
            font-weight: bold;
        }

        .score-indicator {
            font-size: 0.8rem;
            color: #4ade80;
            font-weight: bold;
        }

        .hearts {
            font-size: 1rem;
            letter-spacing: 2px;
        }

        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #3a86ff;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 15px 25px 15px;
            background: rgba(15, 14, 23, 0.98);
            gap: 12px;
            z-index: 10;
            flex-shrink: 0;
            border-top: 2px solid rgba(255, 112, 166, 0.2);
        }

        .dir-group {
            display: flex;
            gap: 10px;
            flex: 1.2;
        }

        .btn {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #ff70a6;
            color: #fff;
            font-size: 1.5rem;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex: 1;
            height: 65px;
            touch-action: none;
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 112, 166, 0.6);
            transform: scale(0.95);
        }

        .jump-btn {
            background: rgba(255, 112, 166, 0.35);
            border-color: #ff477e;
            flex: 1;
            height: 65px;
            font-size: 1.05rem;
        }

        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 14, 23, 0.96);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 25;
            overflow-y: auto;
        }

        #main-menu {
            background: linear-gradient(135deg, rgba(20, 18, 30, 0.95) 0%, rgba(10, 9, 15, 0.98) 100%);
            padding-bottom: 20px;
        }

        .screen h2 {
            font-size: 1.5rem;
            margin: 0.5rem 0 0.3rem 0;
            color: #ff70a6;
        }

        #lose-screen h2 { color: #ff4757; }

        .screen p {
            font-size: 0.85rem;
            max-width: 320px;
            line-height: 1.3;
            color: #c0c0d0;
            margin: 0 0 15px 0;
        }

        .restart-btn {
            background: linear-gradient(135deg, #ff70a6, #ff3366);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            pointer-events: auto;
            margin-top: 10px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 5px;
        }

        .level-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 112, 166, 0.3);
            border-radius: 10px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }

        .level-card:active {
            background: rgba(255, 112, 166, 0.2);
            border-color: #ff70a6;
        }

        .level-card h3 {
            margin: 0 0 2px 0;
            font-size: 0.9rem;
            color: #ffb703;
        }

        .level-card span {
            font-size: 0.7rem;
            color: #8888a0;
        }

        .level-card .icon-preview {
            font-size: 1.4rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn-small" id="openMenuBtn">🏠 Меню</button>
            <h1 id="levelTitle">Приключение Шахины</h1>
        </div>
        <div class="hud-info">
            <div class="score-indicator" id="scoreDisplay">💎 0</div>
            <div class="level-indicator" id="levelIndicator">Ур. 1/5</div>
            <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
        </div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="main-menu" class="screen" style="display: flex;">
            <h2>👑 Выбор Главы</h2>
            <p>Выбери уровень, чтобы начать прохождение:</p>
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <div id="win-screen" class="screen">
            <h2>Ура, победа! 🎉</h2>
            <p id="winScoreText">Ты прошла все главы! Шахина — самая крутая принцесса ❤️</p>
            <button class="restart-btn" id="winRestart">В меню</button>
        </div>

        <div id="next-level-screen" class="screen">
            <h2>Глава пройдена! ✨</h2>
            <p id="nextLevelText">Готова к следующему испытанию?</p>
            <button class="restart-btn" id="nextLevelBtn">Следующий уровень</button>
        </div>

        <div id="lose-screen" class="screen">
            <h2>Ой, сердечки кончились! 🙈</h2>
            <p>Попробуй еще раз, у тебя обязательно получится!</p>
            <button class="restart-btn" id="loseRestart">Повторить</button>
        </div>
    </div>

    <div class="controls">
        <div class="dir-group">
            <button class="btn" id="leftBtn">⬅️</button>
            <button class="btn" id="rightBtn">➡️</button>
        </div>
        <button class="btn jump-btn" id="jumpBtn">Прыжок ⬆️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const VIEW_WIDTH = 680;
        let VIEW_HEIGHT = 440;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            VIEW_HEIGHT = VIEW_WIDTH * (canvas.height / canvas.width);
            if (!isInMenu) setupLevel();
        }
        window.addEventListener('resize', resizeCanvas);

        let currentLevel = 1;
        let lives = 3;
        let score = 0;
        let isInMenu = true;
        let gameWon = false;
        let gameOver = false;
        let levelCleared = false;
        let invulnerableTimer = 0;
        let floatingTexts = [];

        const player = {
            x: 80,
            y: 0,
            width: 40,
            height: 56,
            speed: 5.5,
            dx: 0,
            dy: 0,
            jumpPower: -12.5,
            gravity: 0.58,
            grounded: false
        };

        let platforms = [];
        let enemies = [];
        let flag = { x: 0, y: 0, width: 50, height: 100 };
        let levelLength = 7000;

        // Темы с уникальными фонами и врагами для каждого уровня
        const levelThemes = {
            1: { 
                name: "Глава 1: Зеленые луга", 
                icon: "🌳", 
                sky1: "#2b2d42", sky2: "#3a86ff", sky3: "#8338ec", 
                ground1: "#1b4332", ground2: "#2d6a4f", brick: "#cc5803",
                bgType: "trees" // Зеленые холмы и деревья
            },
            2: { 
                name: "Глава 2: Пустынный каньон", 
                icon: "🏜️", 
                sky1: "#4a154b", sky2: "#e07a5f", sky3: "#f4a261", 
                ground1: "#6b705c", ground2: "#a5a58d", brick: "#bc6c25",
                bgType: "canyon" // Скалы и песчаные барханы
            },
            3: { 
                name: "Глава 3: Темный замок", 
                icon: "🏰", 
                sky1: "#0b090a", sky2: "#161a1d", sky3: "#370617", 
                ground1: "#212529", ground2: "#343a40", brick: "#7209b7",
                bgType: "castle" // Каменные башни замка
            },
            4: { 
                name: "Глава 4: Магический лес", 
                icon: "🍄", 
                sky1: "#03071e", sky2: "#370617", sky3: "#6a040f", 
                ground1: "#132a13", ground2: "#31572c", brick: "#9d0208",
                bgType: "magic_forest" // Светящиеся магические деревья и грибы
            },
            5: { 
                name: "Глава 5: Небесный город", 
                icon: "🛸", 
                sky1: "#001d3d", sky2: "#003566", sky3: "#ffc300", 
                ground1: "#000814", ground2: "#001d3d", brick: "#ff0054",
                bgType: "cyber_city" // Футуристический город будущего
            }
        };

        const levelGrid = document.getElementById('levelGrid');
        for (let i = 1; i <= 5; i++) {
            const card = document.createElement('div');
            card.className = 'level-card';
            card.innerHTML = `
                <div>
                    <h3>${levelThemes[i].name}</h3>
                    <span>Начать прохождение</span>
                </div>
                <div class="icon-preview">${levelThemes[i].icon}</div>
            `;
            card.addEventListener('click', () => {
                currentLevel = i;
                startLevel();
            });
            levelGrid.appendChild(card);
        }

        function startLevel() {
            isInMenu = false;
            lives = 3;
            score = 0;
            gameWon = false;
            gameOver = false;
            levelCleared = false;
            floatingTexts = [];
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lose-screen').style.display = 'none';
            document.getElementById('next-level-screen').style.display = 'none';
            setupLevel();
        }

        function setupLevel() {
            const groundY = VIEW_HEIGHT - 65;
            levelLength = 6500 + (currentLevel * 800);

            platforms = [
                { x: 0, y: groundY, width: levelLength, height: 65, type: 'ground' }
            ];

            enemies = [];
            
            let pCount = Math.floor(levelLength / 230);
            for (let i = 1; i <= pCount; i++) {
                let px = 280 + (i * 230) + (Math.random() * 40 - 20);
                let pWidth = 110 + Math.random() * 45;
                let pHeight = 24;
                let py = VIEW_HEIGHT - 150 - (i % 2 === 0 ? 65 : 0) - (Math.random() * 25);
                
                platforms.push({ x: px, y: py, width: pWidth, height: pHeight, type: 'brick' });

                if (i % 2 === 0) {
                    enemies.push({
                        x: px + 15,
                        y: py - 32,
                        width: 34,
                        height: 32,
                        speed: 1.6 + currentLevel * 0.25,
                        minX: px,
                        maxX: px + pWidth - 34,
                        dir: 1,
                        type: currentLevel
                    });
                }
            }

            for (let gx = 450; gx < levelLength - 500; gx += 500) {
                enemies.push({
                    x: gx,
                    y: groundY - 32,
                    width: 34,
                    height: 32,
                    speed: 1.7 + currentLevel * 0.2,
                    minX: gx - 120,
                    maxX: gx + 140,
                    dir: 1,
                    type: currentLevel
                });
            }

            flag.x = levelLength - 400;
            flag.y = groundY - 100;

            player.x = 80;
            player.y = groundY - player.height;
            player.dx = 0;
            player.dy = 0;

            document.getElementById('levelTitle').innerText = levelThemes[currentLevel].name;
            document.getElementById('levelIndicator').innerText = `Ур. ${currentLevel}/5`;
            updateHUD();
        }

        resizeCanvas();

        function updateHUD() {
            let hStr = '';
            for (let i = 0; i < 3; i++) {
                hStr += i < lives ? '❤️' : '🖤';
            }
            document.getElementById('heartsDisplay').innerText = hStr;
            document.getElementById('scoreDisplay').innerText = `💎 ${score}`;
        }

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); };
            const deactivate = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); };

            el.addEventListener('touchstart', activate, {passive: false});
            el.addEventListener('touchend', deactivate, {passive: false});
            el.addEventListener('touchcancel', deactivate, {passive: false});
            el.addEventListener('mousedown', activate);
            el.addEventListener('mouseup', deactivate);
            el.addEventListener('mouseleave', deactivate);
        }
        bindTouch('leftBtn', 'ArrowLeft');
        bindTouch('rightBtn', 'ArrowRight');
        bindTouch('jumpBtn', 'Space');

        document.getElementById('openMenuBtn').addEventListener('click', () => {
            isInMenu = true;
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lose-screen').style.display = 'none';
            document.getElementById('next-level-screen').style.display = 'none';
        });

        document.getElementById('winRestart').addEventListener('click', () => {
            isInMenu = true;
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        });

        document.getElementById('loseRestart').addEventListener('click', () => {
            lives = 3;
            gameOver = false;
            document.getElementById('lose-screen').style.display = 'none';
            setupLevel();
        });

        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            levelCleared = false;
            document.getElementById('next-level-screen').style.display = 'none';
            currentLevel++;
            setupLevel();
        });

        let cameraX = 0;

        function update() {
            if (isInMenu || gameWon || gameOver || levelCleared) return;

            if (invulnerableTimer > 0) invulnerableTimer--;

            // Обновление всплывающих бонусов
            floatingTexts.forEach((ft, index) => {
                ft.y -= 1.2;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(index, 1);
            });

            player.dx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;

            if ((keys['Space'] || keys['ArrowUp'] || keys['W']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += player.gravity;

            player.x += player.dx;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dx > 0) player.x = p.x - player.width;
                    else if (player.dx < 0) player.x = p.x + p.width;
                }
            });

            player.y += player.dy;
            player.grounded = false;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dy > 0) {
                        player.y = p.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                    } else if (player.dy < 0) {
                        player.y = p.y + p.height;
                        player.dy = 0;
                    }
                }
            });

            // Обработка врагов и бонусов за убийство
            enemies.forEach(en => {
                en.x += en.speed * en.dir;
                if (en.x > en.maxX || en.x < en.minX) en.dir *= -1;

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= en.y + 14) {
                        // Убийство врага с бонусом!
                        enemies.splice(enemies.indexOf(en), 1);
                        player.dy = -10;
                        score += 100;
                        updateHUD();
                        floatingTexts.push({ x: en.x, y: en.y - 10, text: "+100 💎", alpha: 1.0 });
                    } else {
                        if (invulnerableTimer === 0) {
                            lives--;
                            updateHUD();
                            invulnerableTimer = 60;
                            player.dy = -8;
                            if (lives <= 0) {
                                gameOver = true;
                                document.getElementById('lose-screen').style.display = 'flex';
                            }
                        }
                    }
                }
            });

            if (player.y > VIEW_HEIGHT + 100) {
                lives = 0;
                updateHUD();
                gameOver = true;
                document.getElementById('lose-screen').style.display = 'flex';
            }

            if (
                player.x < flag.x + flag.width &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.height &&
                player.y + player.height > flag.y
            ) {
                if (currentLevel < 5) {
                    levelCleared = true;
                    document.getElementById('nextLevelText').innerText = `Ты успешно прошла главу ${currentLevel}! Твой счет: ${score} очков.`;
                    document.getElementById('next-level-screen').style.display = 'flex';
                } else {
                    gameWon = true;
                    document.getElementById('winScoreText').innerText = `Ты прошла все 5 глав! Итоговый счет: ${score} очков. Шахина — абсолютная победительница ❤️👑`;
                    document.getElementById('win-screen').style.display = 'flex';
                }
            }

            cameraX = player.x - VIEW_WIDTH * 0.3;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > levelLength - VIEW_WIDTH) cameraX = levelLength - VIEW_WIDTH;
        }

        function draw() {
            ctx.setTransform(canvas.width / VIEW_WIDTH, 0, 0, canvas.height / VIEW_HEIGHT, 0, 0);

            const theme = levelThemes[currentLevel];
            let skyGradient = ctx.createLinearGradient(0, 0, 0, VIEW_HEIGHT);
            skyGradient.addColorStop(0, theme.sky1);
            skyGradient.addColorStop(0.5, theme.sky2);
            skyGradient.addColorStop(1, theme.sky3);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            if (isInMenu) {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                return;
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            // УНИКАЛЬНЫЙ ЗАДНИЙ ФОН ДЛЯ КАЖДОЙ ГЛАВЫ
            const bgType = theme.bgType;
            if (bgType === "trees") {
                // Глава 1: Зеленые холмы и деревья
                ctx.fillStyle = 'rgba(45, 106, 79, 0.4)';
                for (let hx = 0; hx < levelLength; hx += 350) {
                    ctx.beginPath();
                    ctx.arc(hx, VIEW_HEIGHT - 65, 180, Math.PI, 0, false);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(82, 183, 136, 0.25)';
                for (let dx = 100; dx < levelLength; dx += 280) {
                    ctx.fillRect(dx, VIEW_HEIGHT - 220, 24, 155);
                    ctx.beginPath();
                    ctx.arc(dx + 12, VIEW_HEIGHT - 220, 50, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (bgType === "canyon") {
                // Глава 2: Пустынный каньон и скалы
                ctx.fillStyle = 'rgba(188, 108, 37, 0.35)';
                for (let cx = 50; cx < levelLength; cx += 400) {
                    ctx.fillRect(cx, VIEW_HEIGHT - 280, 120, 215);
                    ctx.beginPath();
                    ctx.moveTo(cx - 30, VIEW_HEIGHT - 280);
                    ctx.lineTo(cx + 60, VIEW_HEIGHT - 350);
                    ctx.lineTo(cx + 150, VIEW_HEIGHT - 280);
                    ctx.fill();
                }
            } else if (bgType === "castle") {
                // Глава 3: Темный замок
                ctx.fillStyle = 'rgba(114, 9, 183, 0.25)';
                for (let bx = 150; bx < levelLength; bx += 500) {
                    ctx.fillRect(bx, VIEW_HEIGHT - 320, 140, 255);
                    // Зубцы стен
                    for (let zx = bx; zx < bx + 140; zx += 30) {
                        ctx.fillRect(zx, VIEW_HEIGHT - 345, 18, 25);
                    }
                    // Желтые светящиеся окна
                    ctx.fillStyle = 'rgba(255, 214, 10, 0.2)';
                    ctx.fillRect(bx + 25, VIEW_HEIGHT - 250, 25, 45);
                    ctx.fillRect(bx + 90, VIEW_HEIGHT - 250, 25, 45);
                    ctx.fillStyle = 'rgba(114, 9, 183, 0.25)';
                }
            } else if (bgType === "magic_forest") {
                // Глава 4: Магический лес со светящимися грибами
                ctx.fillStyle = 'rgba(247, 37, 133, 0.2)';
                for (let fx = 100; fx < levelLength; fx += 320) {
                    ctx.fillRect(fx + 20, VIEW_HEIGHT - 240, 20, 175);
                    // Светящаяся крона
                    ctx.beginPath();
                    ctx.arc(fx + 30, VIEW_HEIGHT - 240, 65, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (bgType === "cyber_city") {
                // Глава 5: Небесный футуристический город
                ctx.fillStyle = 'rgba(0, 53, 102, 0.5)';
                for (let rx = 80; rx < levelLength; rx += 380) {
                    ctx.fillRect(rx, VIEW_HEIGHT - 350, 90, 285);
                    // Неоновые линии
                    ctx.fillStyle = 'rgba(255, 0, 84, 0.4)';
                    ctx.fillRect(rx + 10, VIEW_HEIGHT - 300, 70, 6);
                    ctx.fillRect(rx + 10, VIEW_HEIGHT - 200, 70, 6);
                    ctx.fillStyle = 'rgba(0, 53, 102, 0.5)';
                }
            }

            // Платформы
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = theme.ground1;
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = theme.ground2;
                    ctx.fillRect(p.x, p.y, p.width, 18);
                    
                    ctx.fillStyle = '#52b788';
                    for (let tx = p.x; tx < p.x + p.width; tx += 30) {
                        ctx.fillRect(tx, p.y, 14, 6);
                    }
                } else {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(p.x, p.y + p.height - 4, p.width, 4);

                    ctx.fillStyle = theme.brick;
                    ctx.fillRect(p.x, p.y, p.width, p.height);

                    ctx.fillStyle = '#e85d04';
                    ctx.fillRect(p.x, p.y, p.width, 7);

                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    for (let bx = p.x + 20; bx < p.x + p.width; bx += 35) {
                        ctx.fillRect(bx, p.y + 7, 3, p.height - 7);
                    }

                    ctx.fillStyle = '#ffba08';
                    ctx.fillRect(p.x, p.y, p.width, 2);
                }
            });

            // Уникальные враги для каждой главы
            enemies.forEach(en => {
                const ex = en.x;
                const ey = en.y;

                if (en.type === 1) {
                    // Глава 1: Зубастый Цветок
                    ctx.fillStyle = '#d90429';
                    ctx.beginPath();
                    ctx.arc(ex + 17, ey + 16, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff70a6';
                    ctx.fillRect(ex + 12, ey + 16, 10, 16);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(ex + 8, ey + 10, 6, 6);
                    ctx.fillRect(ex + 20, ey + 10, 6, 6);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(ex + 10, ey + 12, 2, 3);
                    ctx.fillRect(ex + 22, ey + 12, 2, 3);
                } else if (en.type === 2) {
                    // Глава 2: Скорпион
                    ctx.fillStyle = '#bc6c25';
                    ctx.fillRect(ex + 4, ey + 12, 26, 16);
                    ctx.fillStyle = '#dda15e';
                    ctx.fillRect(ex + 8, ey + 6, 14, 10);
                    ctx.strokeStyle = '#bc6c25';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(ex + 28, ey + 16);
                    ctx.quadraticCurveTo(ex + 38, ey, ex + 32, ey - 10);
                    ctx.stroke();
                } else if (en.type === 3) {
                    // Глава 3: Летучая мышь
                    ctx.fillStyle = '#3a0ca3';
                    ctx.beginPath();
                    ctx.arc(ex + 17, ey + 16, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#480ca8';
                    ctx.beginPath();
                    ctx.moveTo(ex + 5, ey + 12);
                    ctx.lineTo(ex - 6, ey + 4);
                    ctx.lineTo(ex + 5, ey + 22);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(ex + 29, ey + 12);
                    ctx.lineTo(ex + 40, ey + 4);
                    ctx.lineTo(ex + 29, ey + 22);
                    ctx.fill();
                    ctx.fillStyle = '#ff0054';
                    ctx.fillRect(ex + 11, ey + 12, 3, 3);
                    ctx.fillRect(ex + 20, ey + 12, 3, 3);
                } else if (en.type === 4) {
                    // Глава 4: Злой гриб
                    ctx.fillStyle = '#7209b7';
                    ctx.beginPath();
                    ctx.arc(ex + 17, ey + 12, 16, Math.PI, 0, false);
                    ctx.fill();
                    ctx.fillStyle = '#f72585';
                    ctx.fillRect(ex + 8, ey + 12, 18, 16);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(ex + 10, ey + 4, 4, 4);
                    ctx.fillRect(ex + 20, ey + 6, 5, 4);
                } else {
                    // Глава 5: Робо-бот с лазером
                    ctx.fillStyle = '#212529';
                    ctx.fillRect(ex + 4, ey + 6, 26, 22);
                    ctx.fillStyle = '#ff0054';
                    ctx.fillRect(ex + 10, ey + 12, 14, 6);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(ex + 14, ey + 14, 6, 2);
                    ctx.fillStyle = '#6c757d';
                    ctx.fillRect(ex + 2, ey + 24, 30, 6);
                }
            });

            // Отрисовка всплывающих бонусов за убийство врагов
            floatingTexts.forEach(ft => {
                ctx.fillStyle = `rgba(74, 222, 128, ${ft.alpha})`;
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(ft.text, ft.x, ft.y);
            });

            // Финишный замок
            ctx.fillStyle = '#ff70a6';
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            ctx.fillStyle = '#ff97b7';
            ctx.fillRect(flag.x - 8, flag.y - 45, flag.width + 16, 45);
            ctx.font = '42px sans-serif';
            ctx.fillText('💖', flag.x + 2, flag.y - 52);

            // Шахина
            if (invulnerableTimer === 0 || Math.floor(invulnerableTimer / 5) % 2 === 0) {
                const px = player.x;
                const py = player.y;

                ctx.fillStyle = '#ff3366';
                ctx.fillRect(px + 6, py + 22, player.width - 12, player.height - 22);
                ctx.fillStyle = '#ff668a';
                ctx.fillRect(px + 2, py + 45, player.width - 4, 11);

                ctx.fillStyle = '#ffb703';
                ctx.fillRect(px + 6, py + 4, player.width - 12, 20);

                ctx.fillStyle = '#ffe5ec';
                ctx.fillRect(px + 9, py + 9, player.width - 18, 13);
                ctx.fillStyle = '#2b2d42';
                ctx.fillRect(px + 12, py + 13, 3, 4);
                ctx.fillRect(px + 25, py + 13, 3, 4);

                ctx.fillStyle = '#ffbc42';
                ctx.beginPath();
                ctx.moveTo(px + 6, py + 4);
                ctx.lineTo(px + 12, py - 5);
                ctx.lineTo(px + 20, py + 3);
                ctx.lineTo(px + 28, py - 5);
                ctx.lineTo(px + 34, py + 4);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
