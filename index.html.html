<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приключение Шахины 💖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #0f0e17;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 8px 10px;
            background: rgba(15, 14, 23, 0.95);
            z-index: 5;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            color: #ff8fab;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            background: #3a86ff;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Управление снизу */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 15px 25px 15px;
            background: rgba(15, 14, 23, 0.98);
            gap: 12px;
            z-index: 10;
            flex-shrink: 0;
        }

        .dir-group {
            display: flex;
            gap: 10px;
            flex: 1.2;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ff70a6;
            color: #fff;
            font-size: 1.5rem;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex: 1;
            height: 65px;
            touch-action: none;
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 112, 166, 0.6);
            transform: scale(0.95);
        }

        .jump-btn {
            background: rgba(255, 112, 166, 0.35);
            border-color: #ff477e;
            flex: 1;
            height: 65px;
            font-size: 1.05rem;
        }

        /* Экраны победы/поражения */
        .screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 14, 23, 0.96);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 25;
        }

        .screen h2 {
            font-size: 1.7rem;
            margin: 0 0 10px 0;
            color: #ff70a6;
        }

        #lose-screen h2 { color: #ff4757; }

        .screen p {
            font-size: 1.05rem;
            max-width: 400px;
            line-height: 1.4;
            color: #f1f1f1;
            margin: 0 0 20px 0;
        }

        .restart-btn {
            background: #ff70a6;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 112, 166, 0.5);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Пройди долгий путь к моему сердечку! 👑💖</h1>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="win-screen" class="screen">
            <h2>Ура, ты победила! 🎉</h2>
            <p>Ты у меня самая лучшая Шахина, принцесса моя всегда будь такой маленькой пикми ❤️</p>
            <button class="restart-btn" id="winRestart">Сыграть еще раз</button>
        </div>

        <div id="lose-screen" class="screen">
            <h2>Ой-ой, упс! 🙈</h2>
            <p>Ничего страшного, настоящие принцессы проходят через любые преграды! Давай попробуем еще разок?</p>
            <button class="restart-btn" id="loseRestart">Попробовать снова</button>
        </div>
    </div>

    <div class="controls">
        <div class="dir-group">
            <button class="btn" id="leftBtn">⬅️</button>
            <button class="btn" id="rightBtn">➡️</button>
        </div>
        <button class="btn jump-btn" id="jumpBtn">Прыжок ⬆️</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameWon = false;
        let gameOver = false;

        const player = {
            x: 80,
            y: 100,
            width: 42,
            height: 60,
            speed: 5.5,
            dx: 0,
            dy: 0,
            jumpPower: -13,
            gravity: 0.6,
            grounded: false
        };

        const platforms = [
            { x: 0, y: 0, width: 3800, height: 40, type: 'ground' }, // Заполним через canvas height динамически
            { x: 350, y: 160, width: 160, height: 24, type: 'brick' },
            { x: 600, y: 240, width: 150, height: 24, type: 'brick' },
            { x: 880, y: 160, width: 170, height: 24, type: 'brick' },
            { x: 1150, y: 230, width: 160, height: 24, type: 'brick' },
            { x: 1420, y: 150, width: 150, height: 24, type: 'brick' },
            { x: 1700, y: 230, width: 170, height: 24, type: 'brick' },
            { x: 1980, y: 150, width: 160, height: 24, type: 'brick' },
            { x: 2250, y: 230, width: 150, height: 24, type: 'brick' },
            { x: 2520, y: 150, width: 170, height: 24, type: 'brick' },
            { x: 2820, y: 220, width: 180, height: 24, type: 'brick' },
            { x: 3120, y: 150, width: 190, height: 24, type: 'brick' }
        ];

        let enemies = [
            { x: 400, y: 0, width: 34, height: 32, speed: 1.6, minX: 350, maxX: 470, dir: 1 },
            { x: 920, y: 0, width: 34, height: 32, speed: 1.9, minX: 880, maxX: 1010, dir: 1 },
            { x: 1190, y: 0, width: 34, height: 32, speed: 1.3, minX: 1150, maxX: 1270, dir: 1 },
            { x: 1480, y: 0, width: 34, height: 32, speed: 2.1, minX: 1420, maxX: 1530, dir: 1 },
            { x: 2040, y: 0, width: 34, height: 32, speed: 1.7, minX: 1980, maxX: 2100, dir: 1 },
            { x: 2580, y: 0, width: 34, height: 32, speed: 1.5, minX: 2520, maxX: 2650, dir: 1 },
            { x: 3180, y: 0, width: 34, height: 32, speed: 1.4, minX: 3120, maxX: 3270, dir: 1 }
        ];

        const flag = {
            x: 3500,
            y: 0,
            width: 55,
            height: 110
        };

        function setupPositions() {
            const groundY = canvas.height - 70;
            platforms[0].y = groundY;
            platforms[0].height = 100;

            enemies[0].y = groundY - 32;
            enemies[1].y = groundY - 32;
            enemies[2].y = 230 - 32;
            enemies[3].y = groundY - 32;
            enemies[4].y = groundY - 32;
            enemies[5].y = groundY - 32;
            enemies[6].y = groundY - 32;

            flag.y = groundY - 110;
        }
        setupPositions();
        window.addEventListener('resize', setupPositions);

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('pressed'); };
            const deactivate = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); };

            el.addEventListener('touchstart', activate, {passive: false});
            el.addEventListener('touchend', deactivate, {passive: false});
            el.addEventListener('touchcancel', deactivate, {passive: false});
            el.addEventListener('mousedown', activate);
            el.addEventListener('mouseup', deactivate);
            el.addEventListener('mouseleave', deactivate);
        }
        bindTouch('leftBtn', 'ArrowLeft');
        bindTouch('rightBtn', 'ArrowRight');
        bindTouch('jumpBtn', 'Space');

        document.getElementById('winRestart').addEventListener('click', restartGame);
        document.getElementById('loseRestart').addEventListener('click', restartGame);

        let cameraX = 0;

        function update() {
            if (gameWon || gameOver) return;

            player.dx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;

            if ((keys['Space'] || keys['ArrowUp'] || keys['W']) && player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }

            player.dy += player.gravity;

            // Коллизия по X
            player.x += player.dx;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dx > 0) player.x = p.x - player.width;
                    else if (player.dx < 0) player.x = p.x + p.width;
                }
            });

            // Коллизия по Y
            player.y += player.dy;
            player.grounded = false;
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y < p.y + p.height &&
                    player.y + player.height > p.y
                ) {
                    if (player.dy > 0) {
                        player.y = p.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                    } else if (player.dy < 0) {
                        player.y = p.y + p.height;
                        player.dy = 0;
                    }
                }
            });

            // Враги
            enemies.forEach(en => {
                en.x += en.speed * en.dir;
                if (en.x > en.maxX || en.x < en.minX) en.dir *= -1;

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.dy > 0 && player.y + player.height - player.dy <= en.y + 12) {
                        enemies.splice(enemies.indexOf(en), 1);
                        player.dy = -10;
                    } else {
                        gameOver = true;
                        document.getElementById('lose-screen').style.display = 'flex';
                    }
                }
            });

            if (player.y > canvas.height + 100) {
                gameOver = true;
                document.getElementById('lose-screen').style.display = 'flex';
            }

            if (
                player.x < flag.x + flag.width &&
                player.x + player.width > flag.x &&
                player.y < flag.y + flag.height &&
                player.y + player.height > flag.y
            ) {
                gameWon = true;
                document.getElementById('win-screen').style.display = 'flex';
            }

            cameraX = player.x - canvas.width * 0.3;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > 3800 - canvas.width) cameraX = 3800 - canvas.width;
        }

        function draw() {
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#2b2d42');
            skyGradient.addColorStop(0.5, '#3a86ff');
            skyGradient.addColorStop(1, '#8338ec');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Облака
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            for (let i = 150; i < 3800; i += 300) {
                ctx.beginPath();
                ctx.arc(i, 90, 45, 0, Math.PI * 2);
                ctx.arc(i + 45, 70, 60, 0, Math.PI * 2);
                ctx.arc(i + 100, 90, 45, 0, Math.PI * 2);
                ctx.fill();
            }

            // Платформы
            platforms.forEach(p => {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#1b4332';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#2d6a4f';
                    ctx.fillRect(p.x, p.y, p.width, 16);
                    ctx.fillStyle = '#52b788';
                    ctx.fillRect(p.x, p.y, p.width, 5);
                } else {
                    ctx.fillStyle = '#cc5803';
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = '#e85d04';
                    ctx.fillRect(p.x, p.y, p.width, 8);
                    ctx.fillStyle = '#ffba08';
                    ctx.fillRect(p.x, p.y, p.width, 3);
                }
            });

            // Враги
            enemies.forEach(en => {
                ctx.fillStyle = '#d90429';
                ctx.beginPath();
                ctx.arc(en.x + en.width/2, en.y + 14, 17, Math.PI, 0, false);
                ctx.fill();
                ctx.fillStyle = '#ffccd5';
                ctx.fillRect(en.x + 5, en.y + 14, 24, 18);
                ctx.fillStyle = '#000';
                ctx.fillRect(en.x + 9, en.y + 19, 4, 5);
                ctx.fillRect(en.x + 21, en.y + 19, 4, 5);
            });

            // Замок финиша
            ctx.fillStyle = '#ff70a6';
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
            ctx.fillStyle = '#ff97b7';
            ctx.fillRect(flag.x - 8, flag.y - 45, flag.width + 16, 45);
            ctx.font = '46px sans-serif';
            ctx.fillText('💖', flag.x + 3, flag.y - 55);

            // Персонаж (Шахина)
            const px = player.x;
            const py = player.y;

            // Платье
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(px + 6, py + 24, player.width - 12, player.height - 24);
            ctx.fillStyle = '#ff668a';
            ctx.fillRect(px + 2, py + 48, player.width - 4, 12);

            // Волосы
            ctx.fillStyle = '#ffb703';
            ctx.fillRect(px + 6, py + 5, player.width - 12, 20);

            // Лицо
            ctx.fillStyle = '#ffe5ec';
            ctx.fillRect(px + 10, py + 10, player.width - 20, 13);
            ctx.fillStyle = '#2b2d42';
            ctx.fillRect(px + 13, py + 14, 3, 4);
            ctx.fillRect(px + 26, py + 14, 3, 4);

            // Корона
            ctx.fillStyle = '#ffbc42';
            ctx.beginPath();
            ctx.moveTo(px + 7, py + 5);
            ctx.lineTo(px + 13, py - 5);
            ctx.lineTo(px + 21, py + 3);
            ctx.lineTo(px + 29, py - 5);
            ctx.lineTo(px + 35, py + 5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            gameWon = false;
            gameOver = false;
            player.x = 80;
            player.y = 50;
            player.dx = 0;
            player.dy = 0;
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            keys['Space'] = false;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('pressed'));
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('lose-screen').style.display = 'none';
        }

        loop();
    </script>
</body>
</html>
